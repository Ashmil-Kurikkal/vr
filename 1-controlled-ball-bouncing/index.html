<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Three.js - Controlled Ball Bouncing</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 18px;
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

  <div id="hud">Ball Bouncing</div>

  <script>
    // -----------------------------------------------------------------
    // 1. SCENE, CAMERA, RENDERER
    // -----------------------------------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a202c);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 14);
    camera.lookAt(0, 2, 0);

    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // -----------------------------------------------------------------
    // 2. LIGHTING & GROUND
    // -----------------------------------------------------------------
    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(5, 15, 8);
    scene.add(light, new THREE.AmbientLight(0x555555));

    const loader = new THREE.TextureLoader();

    function makeMat(imagePath, color) {
      return new THREE.MeshLambertMaterial({
        map: loader.load(imagePath),
        color: color
      });
    }

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(24, 24),
      makeMat('assets/court.jpg', 0x2d3748)
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // -----------------------------------------------------------------
    // 3. THE TWO BOUNCING BALLS
    // -----------------------------------------------------------------
    // 1) Ball 1 - Bounces in place
    const ball1 = new THREE.Mesh(
      new THREE.SphereGeometry(0.8, 24, 24),
      makeMat('assets/ball.jpg', 0xf59e0b)
    );
    ball1.position.set(-3, 0.8, 0);
    scene.add(ball1);

    // 2) Ball 2 - Direction controllable
    const ball2 = new THREE.Mesh(
      new THREE.SphereGeometry(0.8, 24, 24),
      makeMat('assets/ball2.jpg', 0x3b82f6)
    );
    ball2.position.set(3, 0.8, 0);
    scene.add(ball2);

    // -----------------------------------------------------------------
    // 4. KEYBOARD CONTROLS
    // -----------------------------------------------------------------
    const keys = {};
    window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    // -----------------------------------------------------------------
    // 5. GAME LOOP & BOUNCING
    // -----------------------------------------------------------------
    const gravity = 0.008;
    const bounceSpeed = 0.22;
    let speedY1 = 0.22;
    let speedY2 = 0.22;

    function animate() {
      requestAnimationFrame(animate);

      // Ball 1: Bounce
      speedY1 -= gravity;
      ball1.position.y += speedY1;
      if (ball1.position.y <= 0.8) {
        ball1.position.y = 0.8;
        speedY1 = bounceSpeed;
      }

      // Ball 2: Bounce
      speedY2 -= gravity;
      ball2.position.y += speedY2;
      if (ball2.position.y <= 0.8) {
        ball2.position.y = 0.8;
        speedY2 = bounceSpeed;
      }

      // Ball 2 Movement
      const moveSpeed = 0.12;
      if (keys['w'] || keys['arrowup']) ball2.position.z -= moveSpeed;
      if (keys['s'] || keys['arrowdown']) ball2.position.z += moveSpeed;
      if (keys['a'] || keys['arrowleft']) ball2.position.x -= moveSpeed;
      if (keys['d'] || keys['arrowright']) ball2.position.x += moveSpeed;

      ball2.position.x = Math.max(-10, Math.min(10, ball2.position.x));
      ball2.position.z = Math.max(-10, Math.min(10, ball2.position.z));

      ball1.rotation.y += 0.01;
      ball2.rotation.y += 0.01;

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>

</html>
