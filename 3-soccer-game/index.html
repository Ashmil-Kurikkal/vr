<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Three.js - 1v1 Soccer Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 18px;
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

  <div id="hud">
    Score: <span id="p1-score">0</span> - <span id="p2-score">0</span>
  </div>

  <script>
    // -----------------------------------------------------------------
    // 1. SCENE, CAMERA, RENDERER
    // -----------------------------------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a202c);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 16, 17);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // -----------------------------------------------------------------
    // 2. LIGHTING & GREEN PITCH (NO IMAGE)
    // -----------------------------------------------------------------
    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(5, 18, 8);
    scene.add(light, new THREE.AmbientLight(0x666666));

    // Plain green ground
    const pitch = new THREE.Mesh(
      new THREE.PlaneGeometry(16, 26),
      new THREE.MeshLambertMaterial({ color: 0x2e7d32 })
    );
    pitch.rotation.x = -Math.PI / 2;
    scene.add(pitch);

    // Goalposts (Top and Bottom)
    function makeGoal(zPos) {
      const goal = new THREE.Group();
      const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });

      const p1 = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.8), mat);
      p1.position.set(-2.5, 0.9, 0);

      const p2 = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.8), mat);
      p2.position.set(2.5, 0.9, 0);

      const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 5.0), mat);
      bar.rotation.z = Math.PI / 2;
      bar.position.set(0, 1.8, 0);

      goal.add(p1, p2, bar);
      goal.position.set(0, 0, zPos);
      scene.add(goal);
    }
    makeGoal(-12.5); // Player 2 goal
    makeGoal(12.5);  // Player 1 goal

    // -----------------------------------------------------------------
    // 3. THE PLAYERS (CUBES WITH FACES) & WHITE BALL
    // -----------------------------------------------------------------
    const loader = new THREE.TextureLoader();

    function makeMat(imagePath, color) {
      return new THREE.MeshLambertMaterial({
        map: loader.load(imagePath),
        color: color
      });
    }

    // Player 1 (Blue) - Cube with face image
    const player1 = new THREE.Mesh(
      new THREE.BoxGeometry(1.4, 1.4, 1.4),
      makeMat('assets/player1.jpg', 0x2563eb)
    );
    scene.add(player1);

    // Player 2 (CPU / Red) - Cube with face image
    const player2 = new THREE.Mesh(
      new THREE.BoxGeometry(1.4, 1.4, 1.4),
      makeMat('assets/player2.jpg', 0xdc2626)
    );
    scene.add(player2);

    // Plain white soccer ball (NO image)
    const ball = new THREE.Mesh(
      new THREE.SphereGeometry(0.65, 24, 24),
      new THREE.MeshLambertMaterial({ color: 0xffffff })
    );
    scene.add(ball);

    // -----------------------------------------------------------------
    // 4. KEYBOARD CONTROLS
    // -----------------------------------------------------------------
    const keys = {};
    window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    // -----------------------------------------------------------------
    // 5. GAME LOOP, PHYSICS & AI
    // -----------------------------------------------------------------
    let p1Score = 0;
    let p2Score = 0;
    let ballVx = 0;
    let ballVz = 0;
    let isKickOff = true;

    function resetGame() {
      ball.position.set(0, 0.65, 0);
      ballVx = 0;
      ballVz = 0;
      player1.position.set(0, 0.7, 4);
      player2.position.set(0, 0.7, -6);
      isKickOff = true;
    }

    resetGame();

    function handleKick(player, isCpu) {
      const dx = ball.position.x - player.position.x;
      const dz = ball.position.z - player.position.z;
      const dist = Math.sqrt(dx * dx + dz * dz);
      const minDist = 1.35;

      if (dist < minDist && dist > 0.001) {
        // Separate ball from player to prevent sticking
        const push = (minDist - dist) + 0.1;
        ball.position.x += (dx / dist) * push;
        ball.position.z += (dz / dist) * push;

        if (isCpu) {
          // CPU kicks forward towards Player 1's goal
          ballVx = (dx / dist) * 0.15;
          ballVz = 0.22;
        } else {
          // Player 1 kick-off or kick forward towards opponent goal
          isKickOff = false;
          ballVx = (dx / dist) * 0.22;
          ballVz = (dz / dist) * 0.22 - 0.14;
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      // --- 1. Player 1 Movement ---
      const speed = 0.15;
      if (keys['w'] || keys['arrowup']) player1.position.z -= speed;
      if (keys['s'] || keys['arrowdown']) player1.position.z += speed;
      if (keys['a'] || keys['arrowleft']) player1.position.x -= speed;
      if (keys['d'] || keys['arrowright']) player1.position.x += speed;

      player1.position.x = Math.max(-6.5, Math.min(6.5, player1.position.x));
      player1.position.z = Math.max(-11.5, Math.min(11.5, player1.position.z));

      // --- 2. Player 2 (CPU) AI Movement ---
      if (!isKickOff) {
        const aiSpeed = 0.075;
        let targetX = ball.position.x;
        let targetZ = ball.position.z - 1.2; // Try to get behind ball

        // If ball is deep in Player 1's territory, hold back to defend
        if (ball.position.z > 3) {
          targetX = ball.position.x * 0.4;
          targetZ = -4.5;
        }

        if (player2.position.x < targetX - 0.1) player2.position.x += aiSpeed;
        else if (player2.position.x > targetX + 0.1) player2.position.x -= aiSpeed;

        if (player2.position.z < targetZ - 0.1) player2.position.z += aiSpeed;
        else if (player2.position.z > targetZ + 0.1) player2.position.z -= aiSpeed;
      }

      player2.position.x = Math.max(-6.5, Math.min(6.5, player2.position.x));
      player2.position.z = Math.max(-11.5, Math.min(11.5, player2.position.z));

      // --- 3. Player vs Player Collision (Prevent crossing each other) ---
      const pDist = player1.position.distanceTo(player2.position);
      if (pDist < 1.4 && pDist > 0.001) {
        const overlap = (1.4 - pDist) / 2;
        const dx = (player1.position.x - player2.position.x) / pDist;
        const dz = (player1.position.z - player2.position.z) / pDist;
        player1.position.x += dx * overlap;
        player1.position.z += dz * overlap;
        player2.position.x -= dx * overlap;
        player2.position.z -= dz * overlap;
      }

      // --- 4. Ball Movement & Friction ---
      ball.position.x += ballVx;
      ball.position.z += ballVz;
      ballVx *= 0.96;
      ballVz *= 0.96;

      ball.rotation.x += ballVz * 1.5;
      ball.rotation.z -= ballVx * 1.5;

      // --- 5. Clean Wall Bounces (Prevent sticking to boundaries) ---
      if (ball.position.x > 6.8) {
        ball.position.x = 6.7;
        ballVx = -Math.abs(ballVx) * 0.8 - 0.04;
      }
      if (ball.position.x < -6.8) {
        ball.position.x = -6.7;
        ballVx = Math.abs(ballVx) * 0.8 + 0.04;
      }

      // Back walls outside the goal mouth
      if (ball.position.z < -11.5 && Math.abs(ball.position.x) >= 2.5) {
        ball.position.z = -11.4;
        ballVz = Math.abs(ballVz) * 0.8 + 0.04;
      }
      if (ball.position.z > 11.5 && Math.abs(ball.position.x) >= 2.5) {
        ball.position.z = 11.4;
        ballVz = -Math.abs(ballVz) * 0.8 - 0.04;
      }

      // --- 6. Kicking Collisions ---
      handleKick(player1, false);
      handleKick(player2, true);

      // --- 7. Goal Detection ---
      if (ball.position.z < -12.2 && Math.abs(ball.position.x) < 2.5) {
        p1Score++;
        document.getElementById('p1-score').innerText = p1Score;
        resetGame();
      }

      if (ball.position.z > 12.2 && Math.abs(ball.position.x) < 2.5) {
        p2Score++;
        document.getElementById('p2-score').innerText = p2Score;
        resetGame();
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>

</html>
