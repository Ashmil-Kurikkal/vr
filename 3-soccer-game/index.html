<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Three.js - 1v1 Soccer Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      color: white;
      background: rgba(0, 0, 0, 0.75);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 20px;
      font-weight: bold;
    }

    .legend {
      font-size: 13px;
      font-weight: normal;
      color: #ddd;
      margin-top: 6px;
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

  <!-- Minimal HUD -->
  <div id="hud">
    Player 1 (Blue): <span id="p1-score">0</span> &nbsp;|&nbsp; Player 2 (Red): <span id="p2-score">0</span>
    <div class="legend">Controls: WASD or Arrow Keys | Push ball into opponent goal</div>
  </div>

  <script>
    // -----------------------------------------------------------------
    // 1. SCENE, CAMERA, RENDERER
    // -----------------------------------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a202c);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 16, 17);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // -----------------------------------------------------------------
    // 2. LIGHTING & GROUND / PITCH
    // -----------------------------------------------------------------
    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(5, 18, 8);
    scene.add(light, new THREE.AmbientLight(0x666666));

    const loader = new THREE.TextureLoader();

    // Helper to create material with image texture and fallback color
    function makeMat(imagePath, color) {
      return new THREE.MeshLambertMaterial({
        map: loader.load(imagePath),
        color: color
      });
    }

    // Soccer Field Pitch
    const pitch = new THREE.Mesh(
      new THREE.PlaneGeometry(16, 26),
      makeMat('assets/field.jpg', 0x15803d)
    );
    pitch.rotation.x = -Math.PI / 2;
    scene.add(pitch);

    // Goalposts (Top and Bottom)
    function makeGoal(zPos) {
      const goal = new THREE.Group();
      const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });

      // Left post
      const p1 = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.8), mat);
      p1.position.set(-2.5, 0.9, 0);

      // Right post
      const p2 = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.8), mat);
      p2.position.set(2.5, 0.9, 0);

      // Crossbar
      const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 5.0), mat);
      bar.rotation.z = Math.PI / 2;
      bar.position.set(0, 1.8, 0);

      goal.add(p1, p2, bar);
      goal.position.set(0, 0, zPos);
      scene.add(goal);
    }
    makeGoal(-12.5); // Player 2 goal
    makeGoal(12.5);  // Player 1 goal

    // -----------------------------------------------------------------
    // 3. THE PLAYERS (CUBES WITH FACES) & SOCCER BALL
    // -----------------------------------------------------------------
    // 1) Player 1 (User) - Blue Cube with face texture
    const player1 = new THREE.Mesh(
      new THREE.BoxGeometry(1.4, 1.4, 1.4),
      makeMat('assets/player1.jpg', 0x2563eb)
    );
    player1.position.set(0, 0.7, 6);
    scene.add(player1);

    // 2) Player 2 (AI Opponent) - Red Cube with face texture
    const player2 = new THREE.Mesh(
      new THREE.BoxGeometry(1.4, 1.4, 1.4),
      makeMat('assets/player2.jpg', 0xdc2626)
    );
    player2.position.set(0, 0.7, -6);
    scene.add(player2);

    // 3) Soccer Ball - Sphere with soccer ball texture
    const ball = new THREE.Mesh(
      new THREE.SphereGeometry(0.65, 24, 24),
      makeMat('assets/ball.jpg', 0xffffff)
    );
    ball.position.set(0, 0.65, 0);
    scene.add(ball);

    // -----------------------------------------------------------------
    // 4. KEYBOARD CONTROLS (PLAYER 1 MOVEMENT)
    // -----------------------------------------------------------------
    const keys = {};
    window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    // -----------------------------------------------------------------
    // 5. GAME LOOP, AI & BALL PHYSICS
    // -----------------------------------------------------------------
    let p1Score = 0;
    let p2Score = 0;
    let ballVx = 0;
    let ballVz = 0;

    function resetBall() {
      ball.position.set(0, 0.65, 0);
      ballVx = 0;
      ballVz = 0;
      player1.position.set(0, 0.7, 6);
      player2.position.set(0, 0.7, -6);
    }

    function animate() {
      requestAnimationFrame(animate);

      // Player 1 Movement (User)
      const speed = 0.15;
      if (keys['w'] || keys['arrowup']) player1.position.z -= speed;
      if (keys['s'] || keys['arrowdown']) player1.position.z += speed;
      if (keys['a'] || keys['arrowleft']) player1.position.x -= speed;
      if (keys['d'] || keys['arrowright']) player1.position.x += speed;

      // Keep Player 1 in pitch
      player1.position.x = Math.max(-6.5, Math.min(6.5, player1.position.x));
      player1.position.z = Math.max(-11.5, Math.min(11.5, player1.position.z));

      // Player 2 Movement (AI Opponent chases ball)
      const aiSpeed = 0.085;
      if (player2.position.x < ball.position.x) player2.position.x += aiSpeed;
      if (player2.position.x > ball.position.x) player2.position.x -= aiSpeed;
      if (player2.position.z < ball.position.z) player2.position.z += aiSpeed;
      if (player2.position.z > ball.position.z) player2.position.z -= aiSpeed;

      // Keep Player 2 in pitch
      player2.position.x = Math.max(-6.5, Math.min(6.5, player2.position.x));
      player2.position.z = Math.max(-11.5, Math.min(11.5, player2.position.z));

      // Ball Physics & Friction
      ball.position.x += ballVx;
      ball.position.z += ballVz;
      ballVx *= 0.96;
      ballVz *= 0.96;

      // Ball rolling rotation
      ball.rotation.x += ballVz * 1.5;
      ball.rotation.z -= ballVx * 1.5;

      // Ball bounce on side touchlines
      if (ball.position.x > 7) {
        ball.position.x = 7;
        ballVx = -ballVx;
      }
      if (ball.position.x < -7) {
        ball.position.x = -7;
        ballVx = -ballVx;
      }

      // --- KICKING: Player 1 & Ball ---
      if (player1.position.distanceTo(ball.position) < 1.35) {
        ballVx = (ball.position.x - player1.position.x) * 0.28;
        ballVz = (ball.position.z - player1.position.z) * 0.28 - 0.1;
      }

      // --- KICKING: Player 2 & Ball ---
      if (player2.position.distanceTo(ball.position) < 1.35) {
        ballVx = (ball.position.x - player2.position.x) * 0.28;
        ballVz = (ball.position.z - player2.position.z) * 0.28 + 0.1;
      }

      // --- GOAL DETECTION ---
      // Player 1 scores in Top Goal
      if (ball.position.z < -12.2) {
        if (Math.abs(ball.position.x) < 2.5) {
          p1Score++;
          document.getElementById('p1-score').innerText = p1Score;
          resetBall();
        } else {
          ball.position.z = -12.2;
          ballVz = -ballVz;
        }
      }

      // Player 2 scores in Bottom Goal
      if (ball.position.z > 12.2) {
        if (Math.abs(ball.position.x) < 2.5) {
          p2Score++;
          document.getElementById('p2-score').innerText = p2Score;
          resetBall();
        } else {
          ball.position.z = 12.2;
          ballVz = -ballVz;
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    // Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>

</html>
