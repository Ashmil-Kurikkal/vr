<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Three.js - Simple Shooting Target Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 18px;
    }

    #reset {
      margin-left: 10px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

  <div id="hud">
    Score: <span id="score">0</span>
    <button id="reset">Reset</button>
  </div>

  <script>
    // -----------------------------------------------------------------
    // 1. SCENE, CAMERA, RENDERER
    // -----------------------------------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111827);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 5);
    camera.lookAt(0, 1.5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // -----------------------------------------------------------------
    // 2. LIGHTING & GROUND
    // -----------------------------------------------------------------
    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(5, 10, 7);
    scene.add(light, new THREE.AmbientLight(0x666666));

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshLambertMaterial({ color: 0x1f2937 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    const loader = new THREE.TextureLoader();

    // -----------------------------------------------------------------
    // 3. ONE GUN & THREE TARGET SPHERES
    // -----------------------------------------------------------------
    // Simple gun cube with image
    const gun = new THREE.Mesh(
      new THREE.BoxGeometry(0.4, 0.3, 1.2),
      new THREE.MeshLambertMaterial({
        map: loader.load('assets/gun.jpg'),
        color: 0x374151
      })
    );
    gun.position.set(0.6, 0.8, 3.5);
    scene.add(gun);

    // Three target spheres (normal red spheres)
    const targets = [];
    const positions = [-2.5, 0, 2.5];

    positions.forEach(x => {
      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.7, 24, 24),
        new THREE.MeshLambertMaterial({ color: 0xef4444 })
      );
      sphere.position.set(x, 1.5, -2);
      scene.add(sphere);
      targets.push(sphere);
    });

    // -----------------------------------------------------------------
    // 4. SHOOTING, HIT SOUND & RESET
    // -----------------------------------------------------------------
    let score = 0;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    // d) Play a hit sound when a target is successfully hit
    function playHitSound() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.1);
    }

    // a) Shoot a ray from the centre of the camera when the mouse button is clicked
    // b) When a target is hit, destroy it and increase the score
    window.addEventListener('click', e => {
      if (e.target.id === 'reset') return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      let hits = raycaster.intersectObjects(targets.filter(t => t.visible));

      // Also check center of camera (0, 0)
      if (hits.length === 0) {
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        hits = raycaster.intersectObjects(targets.filter(t => t.visible));
      }

      if (hits.length > 0) {
        hits[0].object.visible = false; // destroy target
        score += 10;                    // increase score
        document.getElementById('score').innerText = score;
        playHitSound();                 // play sound
      }
    });

    // c) Add a reset button to restore all targets and the score
    document.getElementById('reset').addEventListener('click', () => {
      score = 0;
      targets.forEach(t => t.visible = true);
      document.getElementById('score').innerText = score;
    });

    // -----------------------------------------------------------------
    // 5. ANIMATE
    // -----------------------------------------------------------------
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>

</html>
